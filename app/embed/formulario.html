<!-- Pegar una vez en un bloque HTML personalizado de WordPress. Configurar las dos constantes. -->
<style>
#aging-question {
  --aq-purple: #672f63;
  --aq-red: #e73c4e;
  box-sizing: border-box;
  container: aging-form / inline-size;
  width: 100%;
  min-width: 0;
  max-width: 720px;
  margin: 24px auto;
  padding: clamp(16px, 4vw, 40px);
  border: 1px solid #e7dce7;
  border-radius: 16px;
  background: #fff;
  color: #424242;
  font: 16px/1.6 'Poppins', Arial, sans-serif;
  text-align: left;
  overflow-wrap: anywhere;
}
#aging-question *, #aging-question *::before, #aging-question *::after { box-sizing: border-box; }
#aging-question h2 { margin: 0 0 8px; color: var(--aq-purple); font: 700 clamp(25px, 5vw, 34px)/1.2 'Poppins', Arial, sans-serif; }
#aging-question p { margin: 0 0 20px; }
#aging-question form, #aging-question .aq-fields > div { min-width: 0; margin: 0; }
#aging-question label { display: block; font-weight: 600; margin: 16px 0 6px; }
#aging-question input, #aging-question textarea { display: block; width: 100%; min-width: 0; max-width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid #887b88; border-radius: 7px; background: #fff; color: #303030; font: inherit; font-size: 16px; }
#aging-question textarea { resize: vertical; min-height: 140px; }
#aging-question :focus-visible { outline: 3px solid var(--aq-purple); outline-offset: 3px; }
#aging-question .aq-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0 16px; }
#aging-question .aq-turnstile { margin-top: 16px; min-width: 0; }
#aging-question .aq-turnstile:empty { margin-top: 0; }
#aging-question .aq-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
#aging-question button { min-width: 0; max-width: 100%; min-height: 48px; padding: 12px 24px; border: 0; border-radius: 24px; background: var(--aq-red); color: #fff; font: 600 16px/1.4 'Poppins', Arial, sans-serif; white-space: normal; cursor: pointer; }
#aging-question button:disabled { background: #746574; cursor: not-allowed; }
#aging-question .aq-identity { padding: 10px 12px; border-radius: 7px; background: #f7f1f7; font-size: 14px; }
#aging-question input:read-only { background: #f8f6f8; color: #555; }
#aging-question .aq-help { display: block; margin-top: 8px; font-size: 14px; }
#aging-question .aq-countdown { font-size: 14px; }
#aging-question .aq-message { margin: 16px 0 0; white-space: pre-line; overflow-wrap: anywhere; }
#aging-question .aq-message:empty, #aging-question .aq-countdown:empty { display: none; }
#aging-question .aq-message[data-kind=error] { color: #a0182a; }
#aging-question .aq-message[data-kind=success] { color: #27603b; }
#aging-question .aq-retry { background: transparent; color: var(--aq-purple); border: 1px solid currentColor; margin-top: 12px; }
#aging-question [hidden] { display: none !important; }
@container aging-form (max-width: 460px) {
  #aging-question .aq-actions { align-items: stretch; flex-direction: column; }
  #aging-question .aq-actions button { width: 100%; }
}
@media (max-width: 520px) {
  #aging-question .aq-actions { align-items: stretch; flex-direction: column; }
  #aging-question .aq-actions button { width: 100%; }
}
</style>
<section id="aging-question" aria-labelledby="aq-heading">
  <h2 id="aq-heading">Hacé tu pregunta</h2>
  <p>Compartí tu pregunta con el equipo del encuentro.</p>
  <form>
    <p class="aq-identity" role="status" aria-live="polite" hidden></p>
    <button type="button" class="aq-profile-retry aq-retry" hidden>Reintentar carga de datos</button>
    <div class="aq-fields">
      <div><label for="aq-name">Nombre</label><input id="aq-name" name="name" autocomplete="name" maxlength="150" required></div>
      <div><label for="aq-email">Email</label><input id="aq-email" name="email" type="email" autocomplete="email" maxlength="255" required></div>
    </div>
    <label for="aq-body">Tu pregunta</label>
    <textarea id="aq-body" name="body" maxlength="5000" required aria-describedby="aq-help"></textarea>
    <span id="aq-help" class="aq-help">Todos los campos son obligatorios.</span>
    <div class="aq-turnstile"></div>
    <button type="button" class="aq-retry" hidden>Reintentar verificación</button>
    <div class="aq-actions"><button type="submit" disabled>Enviar pregunta</button><span class="aq-countdown" role="timer" aria-live="off"></span></div>
    <p class="aq-message" role="status" aria-live="polite" aria-atomic="true"></p>
  </form>
  <noscript>Activá JavaScript para verificar y enviar tu pregunta.</noscript>
</section>
<script>
(() => {
  'use strict';
  const BACKEND_URL = document.documentElement.dataset.agingBackendUrl || 'https://aging.huesped.org.ar'; // URL HTTPS de Laravel, sin barra final.
  const TURNSTILE_SITEKEY = '0x4AAAAAAGFREyTTENRSqE3l'; // Clave pública; nunca usar la secreta.
  const root = document.getElementById('aging-question');
  const form = root.querySelector('form');
  // Optional convenience only: URL values never establish authenticated identity.
  const params = new URLSearchParams(window.location.search);
  const hasUid = params.has('uid');
  const uids = params.getAll('uid');
  const uid = uids.length === 1 ? uids[0].trim() : '';
  for (const field of ['name', 'email']) form.elements[field].readOnly = hasUid;
  if (!hasUid) for (const [parameter, field, limit] of [['aging_nombre', 'name', 150], ['aging_email', 'email', 255]]) {
    const values = params.getAll(parameter);
    if (values.length !== 1) continue;
    const value = values[0].trim();
    if (!value || value.length > limit || /[\u0000-\u001f\u007f]/.test(value)) continue;
    const input = form.elements[field];
    input.value = value;
    if (!input.checkValidity()) input.value = '';
  }
  const body = form.elements.body;
  const submit = form.querySelector('[type="submit"]');
  const retry = root.querySelector('.aq-retry');
  const status = root.querySelector('.aq-message');
  const countdown = root.querySelector('.aq-countdown');
  const container = root.querySelector('.aq-turnstile');
  const identityStatus = root.querySelector('.aq-identity');
  const profileRetry = root.querySelector('.aq-profile-retry');
  let identityReady = !hasUid, identityLoading = false, resolvedUid = '';
  let token = '', widgetId = null, widgetSize = '', loading = false, sending = false, until = 0;
  const configured = BACKEND_URL !== 'BACKEND_URL' && TURNSTILE_SITEKEY !== 'TURNSTILE_SITEKEY';
  function message(text, kind = '') { status.textContent = text; status.dataset.kind = kind; }
  function update() {
    const seconds = Math.max(0, Math.ceil((until - Date.now()) / 1000));
    countdown.textContent = seconds ? `Podés volver a preguntar en ${seconds} s.` : '';
    submit.disabled = !configured || !identityReady || sending || seconds > 0 || !token || !body.value.trim();
    submit.textContent = sending ? 'Enviando…' : 'Enviar pregunta';
  }
  async function loadIdentity() {
    if (identityLoading) return;
    identityStatus.hidden = false;
    profileRetry.hidden = true;
    if (!/^[A-Za-z0-9]{40}$/.test(uid)) {
      identityStatus.textContent = 'El enlace personal no es válido. Revisá que esté completo.';
      return;
    }
    identityLoading = true;
    identityStatus.textContent = 'Cargando tus datos…';
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 10000);
    try {
      const response = await fetch(`${BACKEND_URL.replace(/\/$/, '')}/api/participants/resolve`, {
        method: 'POST', credentials: 'omit', signal: controller.signal,
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ uid })
      });
      const data = await response.json();
      if (response.status !== 200 || typeof data.name !== 'string' || typeof data.email !== 'string') {
        identityStatus.textContent = response.status === 404 ? 'No encontramos los datos de este enlace. Revisá el enlace personal que recibiste.' : 'No pudimos cargar tus datos. Reintentá.';
        profileRetry.hidden = false;
        return;
      }
      form.elements.name.value = data.name;
      form.elements.email.value = data.email;
      resolvedUid = uid; identityReady = true;
      identityStatus.textContent = 'Tus datos ya están cargados.';
      startVerification();
    } catch (_) {
      identityStatus.textContent = 'No pudimos cargar tus datos. Revisá tu conexión y reintentá.';
      profileRetry.hidden = false;
    } finally {
      clearTimeout(timeout); identityLoading = false; update();
    }
  }
  profileRetry.addEventListener('click', loadIdentity);
  function resetVerification() {
    token = '';
    if (widgetId !== null && window.turnstile) window.turnstile.reset(widgetId);
    update();
  }
  function verificationError(text) {
    token = ''; retry.hidden = false; message(text, 'error'); update();
  }
  function render() {
    if (widgetId !== null || !window.turnstile || !body.value.trim()) return;
    widgetSize = container.clientWidth < 300 ? 'compact' : 'flexible';
    try {
      widgetId = window.turnstile.render(container, {
        sitekey: TURNSTILE_SITEKEY, action: 'question', language: 'es', size: widgetSize,
        'response-field': false,
        callback(value) { token = value; retry.hidden = true; update(); },
        'expired-callback'() { verificationError('La verificación venció. Volvé a verificar para enviar.'); resetVerification(); },
        'error-callback'(code) { verificationError('No se pudo completar la verificación. Reintentá.' + (code ? ` Código: ${code}.` : '')); return true; },
        'timeout-callback'() { verificationError('La verificación agotó el tiempo. Reintentá.'); }
      });
    } catch (_) { verificationError('No se pudo iniciar la verificación. Reintentá.'); }
  }
  function startVerification() {
    if (!configured || !identityReady || !body.value.trim()) return;
    if (window.turnstile) { render(); return; }
    if (loading) return;
    loading = true;
    const script = document.createElement('script');
    script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
    script.async = true; script.defer = true;
    script.onload = () => { loading = false; render(); };
    script.onerror = () => { loading = false; script.remove(); verificationError('No se pudo cargar la verificación. Revisá tu conexión y reintentá.'); };
    document.head.appendChild(script);
  }
  function resizeVerification() {
    const size = container.clientWidth < 300 ? 'compact' : 'flexible';
    if (widgetId === null || size === widgetSize || sending) return;
    window.turnstile.remove(widgetId);
    widgetId = null; token = '';
    render(); update();
  }
  new ResizeObserver(resizeVerification).observe(container);
  body.addEventListener('input', () => { startVerification(); update(); });
  retry.addEventListener('click', () => {
    retry.hidden = true; message('');
    if (widgetId !== null) resetVerification(); else startVerification();
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (!identityReady || sending || Date.now() < until || !form.reportValidity()) return;
    if (!token) { message('Completá la verificación antes de enviar.', 'error'); startVerification(); return; }
    sending = true; message(''); update();
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 20000);
    try {
      const response = await fetch(`${BACKEND_URL.replace(/\/$/, '')}/api/questions`, {
        method: 'POST', credentials: 'omit', signal: controller.signal,
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ ...(resolvedUid ? { uid: resolvedUid } : { name: form.elements.name.value.trim(), email: form.elements.email.value.trim() }), question: body.value.trim(), 'cf-turnstile-response': token })
      });
      const data = await response.json().catch(() => ({}));
      const seconds = Number(data.retry_after);
      if ((response.status === 201 || response.status === 429) && Number.isFinite(seconds) && seconds >= 0) until = Date.now() + Math.ceil(seconds) * 1000;
      if (response.status === 201) {
        body.value = '';
        message('Tu pregunta fue enviada. ¡Gracias!', 'success');
      } else if (response.status === 429) {
        message('Todavía tenés que esperar para enviar otra pregunta.' + (Number.isFinite(seconds) ? '' : ' Reintentá más tarde.'), 'error');
      } else if (response.status === 422) {
        const errors = data.errors && typeof data.errors === 'object' ? Object.values(data.errors).flat().filter(value => typeof value === 'string') : [];
        message(errors.length ? errors.join('\n') : 'Revisá los datos y la verificación antes de volver a enviar.', 'error');
      } else {
        message('No se pudo enviar tu pregunta. Volvé a verificar e intentá de nuevo.', 'error');
      }
    } catch (_) {
      message('No pudimos confirmar el envío. Revisá tu conexión antes de reintentar; la pregunta podría haberse recibido.', 'error');
    } finally {
      clearTimeout(timeout); sending = false; resetVerification(); resizeVerification(); update();
    }
  });
  if (!configured) message('El formulario todavía no está configurado para recibir preguntas.', 'error');
  if (hasUid && configured) loadIdentity();
  setInterval(update, 250);
  update();
})();
</script>
